name: transfer-034

on:
  pull_request:

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download transfer-v0.3.4-20260911 --repo "$GITHUB_REPOSITORY" --pattern 'Savarona-Ailem-v0.3.4.apk'
          echo '4657e3b6195961fb6261665e3574f255a1cce8e36740209616ad978d35e9d8a9  Savarona-Ailem-v0.3.4.apk' | sha256sum -c -
      - name: Upload Drive transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: savarona-ailem-0.3.4-drive-package
          path: Savarona-Ailem-v0.3.4.apk
          retention-days: 1
