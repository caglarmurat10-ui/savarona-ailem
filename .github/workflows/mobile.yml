name: mobile

on:
  push:
    branches: [main, master]
    paths: ['mobile/**', 'tools/bootstrap_mobile.py', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'tools/bootstrap_mobile.py', '.github/workflows/mobile.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: python3 tools/bootstrap_mobile.py
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://example.invalid
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: savarona-ailem-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: python3 tools/bootstrap_mobile.py
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build ios --debug --no-codesign --dart-define=API_BASE_URL=https://example.invalid
        working-directory: mobile
