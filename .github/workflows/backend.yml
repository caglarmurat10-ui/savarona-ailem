name: backend

on:
  push:
    branches: [main, master]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ADMIN_BOOTSTRAP_SECRET: ci-only-bootstrap-secret
      SESSION_SIGNING_KEY: ci-only-session-signing-key
      PUSH_TOKEN_ENCRYPTION_KEY: ci-only-push-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
