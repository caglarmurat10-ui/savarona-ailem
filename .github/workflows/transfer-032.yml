name: transfer-032

on:
  pull_request:

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download transfer-v0.3.2-20260911 --repo "$GITHUB_REPOSITORY" --pattern 'Savarona-Ailem-v0.3.2.apk'
          echo 'bf95596bd0d4532d63bad93436e6d619cfabc0036be3710a6c83eacf261a263d  Savarona-Ailem-v0.3.2.apk' | sha256sum -c -
      - name: Upload Drive transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: savarona-ailem-0.3.2-drive-package
          path: Savarona-Ailem-v0.3.2.apk
          retention-days: 1
