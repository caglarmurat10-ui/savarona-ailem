name: transfer-signed-apk

on:
  pull_request:
    paths:
      - '.transfer-apk-trigger'
      - '.github/workflows/transfer-signed-apk.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/Savarona-Ailem-v0.3.1.apk \
            'https://github.com/caglarmurat10-ui/savarona-ailem/releases/download/transfer-v0.3.1-20260911/Savarona-Ailem-v0.3.1.apk'
      - name: Verify SHA-256
        run: |
          echo 'bdb5a245fb3a17f137e1ad0f918ceacd0da58b51e4e08b0c559356805deed93e  /tmp/Savarona-Ailem-v0.3.1.apk' | sha256sum -c -
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: savarona-ailem-signed-v0.3.1
          path: /tmp/Savarona-Ailem-v0.3.1.apk
          if-no-files-found: error
          retention-days: 1
