name: appstore-screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Generate iOS shell and build simulator app
        run: |
          python3 tools/bootstrap_mobile.py
          cd mobile
          flutter pub get
          flutter build ios --simulator --debug \
            --dart-define="API_BASE_URL=https://savarona-ailem-api.caglarmurat10.workers.dev"
      - name: Boot latest large iPhone and capture
        run: |
          set -euo pipefail
          DEVICE_NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone 16 Pro Max\) (\([0-9A-F-]*\)) (Shutdown).*$/\1|\2/p' | head -1)
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone .*Pro Max\) (\([0-9A-F-]*\)) (Shutdown).*$/\1|\2/p' | head -1)
          fi
          test -n "$DEVICE_NAME"
          UDID="${DEVICE_NAME##*|}"
          xcrun simctl boot "$UDID" || true
          sleep 35
          for attempt in 1 2 3 4; do
            xcrun simctl install "$UDID" mobile/build/ios/iphonesimulator/Runner.app && break
            sleep 15
          done
          xcrun simctl launch "$UDID" com.savarona.ailem
          sleep 7
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/savarona-ailem-iphone.png
          sips -g pixelWidth -g pixelHeight screenshots/savarona-ailem-iphone.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: savarona-ailem-appstore-screenshot
          path: screenshots/savarona-ailem-iphone.png
          retention-days: 7


