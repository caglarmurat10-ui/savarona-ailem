name: Savarona AI Operations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Savarona tick
        shell: bash
        run: |
          OIDC=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=savarona-ai-core")
          TOKEN=$(printf '%s' "$OIDC" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl -fsS -X POST -H "Authorization: Bearer ${TOKEN}" https://savarona-ai-core.caglarmurat10.workers.dev/internal/tick
