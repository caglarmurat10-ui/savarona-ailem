name: Savarona AI Operations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "15 0 * * *"

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - name: Health audit
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
        env:
          TOKEN: ${{ secrets.SAVARONA_ADMIN_TOKEN }}
        run: curl --fail --silent --show-error -X POST -H "Authorization: Bearer $TOKEN" https://savarona-ai-core.caglarmurat10.workers.dev/internal/health-audit
      - name: Daily self review
        if: github.event.schedule == '15 0 * * *'
        env:
          TOKEN: ${{ secrets.SAVARONA_ADMIN_TOKEN }}
        run: curl --fail --silent --show-error -X POST -H "Authorization: Bearer $TOKEN" https://savarona-ai-core.caglarmurat10.workers.dev/internal/self-review
