name: savarona_ailem
description: Savarona Ailem - consent-based realtime family location sharing
publish_to: none
# App Store'da inceleme bekleyen surum 0.3.5 - yeni build bu surume baglanacagi icin marketing
# surumu 0.3.5 kalmali (flutter build ios --build-name gecmiyor, bu deger kullaniliyor).
# Build numarasi CI'da otomatik uretilir: 1000 + GITHUB_RUN_NUMBER (bkz. testflight.yml).
version: 0.3.5+1005

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
